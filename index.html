<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>GloriousPath</title>
</head>
<body>

    <main>
        <section class="character-info" aria-label="Information du personnage">
            <h1 id="name"></h1>
            <h2 id="age"></h2>
        </section>

        <section class="location-info" aria-label="Information sur le lieu">
            <h3 id="location-name"></h3>
            <img id="location-image" src="">
        </section>

        <section class="narrative-section" aria-label="Section narrative">
            <h3 id="event-title"></h3>
            <div id="narrative">
            </div>

            <div id="options">
            </div>
        </section>

        <section class="character-stats" aria-label="Section des compétences du personnage">
            <h3>Physique : <span id="physique"></span></h3>
            <h3>Sagesse : <span id="sagesse"></span></h3>
            <h3>Intuition : <span id="intuition"></span></h3>
        </section>
    </main>
    
    <script src="game.js"></script>
</body>
</html>
